name: Deploy Infrastructure to AWS
on:
  push:
    branches:
      - "main"
    paths:
      - "infrastructure/**"
      - "backend/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_aws_region: ${{vars.AWS_REGION}}

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      # Setup Node and Install dependencies
      - name: setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          cd backend
          npm install --production

      - name: authenticate OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{vars.AWS_REGION}}
          role-to-assume: ${{vars.AWS_TF_ROLE_ARN}}
          role-session-name: TFAPPLYSESSION

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: initialize
        working-directory: infrastructure
        run: terraform init

      - name: generate plan
        working-directory: infrastructure
        run: terraform plan -out=tfplan
        env:
          TF_VAR_domain_name: ${{secrets.DOMAIN_NAME}}

      - name: show plan
        working-directory: infrastructure
        run: terraform show tfplan > tfplan.json

      - name: upload json plan output
        uses: actions/upload-artifact@v7
        with:
          name: deployment-plan-${{github.sha}}
          path: infrastructure/tfplan.json

      # Raw plan for deployment

      - name: upload raw plan output
        uses: actions/upload-artifact@v7
        with:
          name: raw-deployment-plan-${{github.sha}}
          path: infrastructure/tfplan

      # Uploading the deployment bundle

      - name: upload deployment bundle
        uses: actions/upload-artifact@v7
        with:
          name: deployment-bundle-${{github.sha}}
          path: |
            infrastructure/
            backend/
            !backend/.npm

  # Deploying the infrastructure

  terraform-deploy:
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production
    steps:
      - name: download deployment bundle
        uses: actions/download-artifact@v8
        with:
          name: deployment-bundle-${{github.sha}}

      - name: authenticate OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          audience: sts.amazonaws.com
          aws-region: ${{vars.AWS_REGION}}
          role-to-assume: ${{vars.AWS_TF_ROLE_ARN}}
          role-session-name: TFAPPLYSESSION

      - name: setup terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infrastructure
        run: terraform init

      - name: Run apply
        working-directory: infrastructure
        run: terraform apply -auto-approve tfplan

        env:
          TF_VAR_domain_name: ${{secrets.DOMAIN_NAME}}
